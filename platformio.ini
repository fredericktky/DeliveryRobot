; DeliveryRobot - AIROST Project 1 (basic task): colour-selected ball delivery
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; Pinned: Arduino-ESP32 2.x (ledcSetup / ledcAttachPin were removed in 3.x)
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1    ; Routes Serial output to Native USB
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
monitor_dtr = 1
monitor_rts = 1
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
